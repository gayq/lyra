<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>player :3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet';" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet" /></noscript>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Lexend, sans-serif; }
    </style>
    <script>
      (function () {
        window.__lyraRecoverAsset = function () {
          const now = Date.now();
          const target = new URL(window.location.href);
          const previous = Number(target.searchParams.get("lyra-recovery"));
          if (Number.isFinite(previous) && now - previous < 30_000) return;
          target.searchParams.set("lyra-recovery", String(now));
          window.location.replace(target.href);
        };
        window.addEventListener(
          "vite:preloadError",
          function (event) {
            event.preventDefault();
            window.__lyraRecoverAsset();
          },
          { once: true },
        );
        window.addEventListener(
          "error",
          function (event) {
            const element = event.target;
            const assetUrl =
              element instanceof HTMLScriptElement
                ? element.src
                : element instanceof HTMLLinkElement &&
                    (element.rel === "modulepreload" ||
                      element.rel === "stylesheet")
                  ? element.href
                  : "";
            if (!assetUrl) return;
            const failedUrl = new URL(assetUrl, window.location.href);
            if (
              failedUrl.origin === window.location.origin &&
              /^\/assets\/[^/]+$/.test(failedUrl.pathname)
            ) {
              window.__lyraRecoverAsset();
            }
          },
          true,
        );
      })();
    </script>
  </head>
  <body>
    <div id="player-root"></div>
    <script type="module" src="/app/playerEntry.tsx"></script>
  </body>
</html>
