    <script>
      (function () {
        const storedTheme = localStorage.getItem("theme");
        if (storedTheme && storedTheme !== "default")
          document.documentElement.setAttribute("data-theme", storedTheme);
      })();
    </script>
    <link rel="icon" href="/!!/https://d3njjcbhbojbot.cloudfront.net/web/images/favicons/apple-touch-icon-v2-57x57.png" type="image/x-icon" />

    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet';" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet" /></noscript>
    <script>
      (function () {
        const peakUrls = [
          "/assets/images/peaks/hachii.webp",
          "/assets/images/peaks/kona.webp",
          "/assets/images/peaks/osa.webp",
          "/assets/images/peaks/azu.webp",
        ];
        let previousIndex = -1;
        try {
          const storedIndex = localStorage.getItem("lyra-title-peak-index");
          if (storedIndex !== null) previousIndex = Number(storedIndex);
        } catch {}

        let nextIndex = Math.floor(Math.random() * peakUrls.length);
        if (peakUrls.length > 1 && nextIndex === previousIndex) {
          nextIndex =
            (nextIndex + 1 + Math.floor(Math.random() * (peakUrls.length - 1))) %
            peakUrls.length;
        }

        document.documentElement.dataset.peakIndex = String(nextIndex);
        const preload = document.createElement("link");
        preload.rel = "preload";
        preload.as = "image";
        preload.type = "image/webp";
        preload.href = peakUrls[nextIndex];
        preload.fetchPriority = "high";
        document.head.append(preload);
        try {
          localStorage.setItem("lyra-title-peak-index", String(nextIndex));
        } catch {}
      })();
    </script>
    <script>
      (function () {
        window.__lyraRecoverAsset = function () {
          const now = Date.now();
          const target = new URL(window.location.href);
          const previous = Number(target.searchParams.get("lyra-recovery"));
          if (Number.isFinite(previous) && now - previous < 30_000) return;
          target.searchParams.set("lyra-recovery", String(now));
          window.location.replace(target.href);
        };
        window.addEventListener(
          "vite:preloadError",
          function (event) {
            event.preventDefault();
            window.__lyraRecoverAsset();
          },
          { once: true },
        );
        window.addEventListener(
          "error",
          function (event) {
            const element = event.target;
            const assetUrl =
              element instanceof HTMLScriptElement
                ? element.src
                : element instanceof HTMLLinkElement &&
                    (element.rel === "modulepreload" ||
                      element.rel === "stylesheet")
                  ? element.href
                  : "";
            if (!assetUrl) return;
            const failedUrl = new URL(assetUrl, window.location.href);
            if (
              failedUrl.origin === window.location.origin &&
              /^\/assets\/[^/]+$/.test(failedUrl.pathname)
            ) {
              window.__lyraRecoverAsset();
            }
          },
          true,
        );
      })();
    </script>
    <script type="module" src="/app/entry.tsx"></script>
