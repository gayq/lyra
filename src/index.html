    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (t && t !== "default")
          document.documentElement.setAttribute("data-theme", t);
      })();
      var _revealed = false;
      var _title = "Coursera | Degrees, Certificates, & Free Online Courses";
      var _hardRevealIntervalId = null;
      function _stopRevealGuard() {
        if (_hardRevealIntervalId) {
          clearInterval(_hardRevealIntervalId);
          _hardRevealIntervalId = null;
        }
      }
      function _revealPage() {
        if (_revealed) return;
        _revealed = true;
        _stopRevealGuard();
        try { document.title = _title; } catch (_e) {}
        try {
          var c = document.getElementById("root");
          if (c) c.remove();
        } catch (_e) {}
        try {
          var m = document.querySelector(".meow");
          if (m) m.style.display = "";
        } catch (_e) {}
        try {
          var s = document.getElementById("connection-status");
          if (s) s.style.display = "";
        } catch (_e) {}
      }
      function _onUserAction() {
        document.removeEventListener("click", _onUserAction, true);
        document.removeEventListener("keydown", _onUserAction, true);
        document.removeEventListener("touchstart", _onUserAction, true);
        _revealPage();
      }
      document.addEventListener("click", _onUserAction, true);
      document.addEventListener("keydown", _onUserAction, true);
      document.addEventListener("touchstart", _onUserAction, true);
      var _appReady = false;
      var _minTimeReached = false;
      function _tryReveal() {
        if (_appReady && _minTimeReached) _revealPage();
      }
      window.addEventListener("styles-ready", function () {
        _appReady = true;
        _tryReveal();
      }, { once: true });
      window.addEventListener("load", _revealPage, { once: true });
      window.addEventListener("pageshow", _revealPage, { once: true });
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") _tryReveal();
      });
      _hardRevealIntervalId = setInterval(function () {
        if (_revealed) {
          _stopRevealGuard();
          return;
        }
        _revealPage();
      }, 2500);
      setTimeout(function () {
        _minTimeReached = true;
        _tryReveal();
      }, 9000);
      setTimeout(_revealPage, 1400);
    </script>
