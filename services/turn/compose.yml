services:
  coturn:
    image: coturn/coturn:4.6
    command:
      - --no-cli
      - --fingerprint
      - --lt-cred-mech
      - --realm=lyra-dev.local
      - --user=${TURN_USERNAME:-lyly}:${TURN_CREDENTIAL:-rara}
      - --listening-ip=0.0.0.0
      - --listening-port=${TURN_PORT:-3478}
      - --min-port=49152
      - --max-port=49200
      - --no-multicast-peers
      - --no-loopback-peers
      - --no-tls
      - --no-dtls
      - --log-file=stdout
      - --simple-log
    ports:
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}/tcp"
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}/udp"
      - "49152-49200:49152-49200/udp"
    restart: unless-stopped
