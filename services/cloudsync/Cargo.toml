[package]
name = "cloudsync"
edition = "2021"

[dependencies]
adaptive-capacity = { path = "../../packages/adaptive-capacity" }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bcrypt = "0.15"
argon2 = "0.5"
base64 = "0.22"
jsonwebtoken = "9"
aes-gcm = "0.10"
rand = "0.8"
brotli = "8.0.4"
tower-cookies = "0.10"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.5", features = ["set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
time = "0.3"
sha2 = "0.10"
tower_governor = "0.4"
r2d2 = "0.8"
r2d2_sqlite = "0.24"
mimalloc = "0.1"
dashmap = "6"
sysinfo = "0.32"
zeroize = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
overflow-checks = false
debug = false
