[package]
name = "nuru"
version = "0.0.1"
edition = "2021"

[dependencies]
anyhow = "1.0.86"
async-speed-limit = { version = "0.4.2", optional = true, features = ["tokio"] }
async-trait = "0.1.81"
base64 = "0.22.1"
bytes = "1.7.1"
cfg-if = "1.0.0"
dashmap = "5.5.3"
clap = { version = "4.5.16", features = ["cargo", "derive"] }
console-subscriber = { version = "0.4.1", optional = true }
ed25519-dalek = { version = "2.1.1", features = ["pem"] }
env_logger = "0.11.5"
event-listener = "5.3.1"
futures-util = "0.3.30"
hickory-resolver = "0.25.2"
http-body-util = "0.1.2"
hyper = { version = "1.4.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.7", features = ["tokio"] }
lazy_static = "1.5.0"
libc = { version = "0.2.158", optional = true }
log = { version = "0.4.22", features = ["serde", "std"] }
nix = { version = "0.30.1", features = ["term"] }
pin-project-lite = "0.2.15"
pty-process = { version = "0.5.3", features = ["async", "tokio"], optional = true }
regex = "1.10.6"
rustls-pemfile = "2.1.3"
serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.125"
serde_yaml = { version = "0.9.34", optional = true }
sha1 = "0.10.6"
sha2 = "0.10.8"
shell-words = { version = "1.1.0", optional = true }
tokio = { version = "1.43.0", features = ["full"] }
tokio-rustls = { version = "0.26.0", features = ["ring", "tls12"], default-features = false }
tokio-util = { version = "0.7.11", features = ["codec", "compat", "io-util", "net"] }
tokio-websockets = { version = "0.12.0", features = ["server", "sha1_smol"] }
toml = { version = "0.9.2", optional = true }
uuid = { version = "1.10.0", features = ["v4"] }
wisp-mux = { git = "https://github.com/MercuryWorkshop/epoxy-tls", branch = "multiplexed", features = ["tokio-websockets", "certificate"] }
socket2 = "0.6.3"
crossbeam-queue = "0.3.12"

[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemalloc-ctl = { version = "0.6.0", features = ["stats", "use_std"] }
tikv-jemallocator = "0.6.0"

[features]
default = ["toml"]
yaml = ["dep:serde_yaml"]
toml = ["dep:toml"]
twisp = ["dep:pty-process", "dep:libc", "dep:shell-words"]
speed-limit = ["dep:async-speed-limit"]
tokio-console = ["dep:console-subscriber"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true